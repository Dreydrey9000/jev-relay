[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-relay"
version = "0.1.0"
description = "Local-first advisory decisions with explicit fallbacks"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
jev-relay = "jev_relay.cli:main"

[tool.setuptools.packages.find]
include = ["jev_relay*"]
