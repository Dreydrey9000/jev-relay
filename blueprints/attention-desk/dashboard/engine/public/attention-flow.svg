<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
<title id="title">Attention Desk: from message history to a reviewed queue</title><desc id="desc">Authorized Gmail threads and a local Messages snapshot enter read-only history checks. Your dashboard shows possible unanswered conversations. You mark important, not important or ignored. New incoming messages return the conversation to review. Nothing is sent, deleted or passed to a paid AI provider.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#e4cc93"/></marker></defs>
<rect width="1000" height="720" fill="#0b0b0d"/><g font-family="sans-serif" fill="#f4f1ec"><text x="50" y="62" font-size="30" font-weight="bold">ATTENTION DESK</text><text x="50" y="98" font-size="19" fill="#c1bac7">Old messages. Clear decisions. Your inbox stays yours.</text>
<g fill="#17171c" stroke="#8e7d59" stroke-width="2"><rect x="50" y="145" width="400" height="95" rx="15"/><rect x="550" y="145" width="400" height="95" rx="15"/><rect x="225" y="305" width="550" height="100" rx="15"/><rect x="225" y="465" width="550" height="90" rx="15"/><rect x="50" y="615" width="260" height="60" rx="12"/><rect x="370" y="615" width="260" height="60" rx="12"/><rect x="690" y="615" width="260" height="60" rx="12"/></g>
<g text-anchor="middle" font-size="22"><text x="250" y="185">Gmail thread history</text><text x="750" y="185">Mac Messages snapshot</text><text x="500" y="345">Check the latest incoming / outgoing message</text><text x="500" y="500">Review possible unanswered conversations</text><text x="180" y="652">Important</text><text x="500" y="652">Not important</text><text x="820" y="652">Ignored</text></g>
<g text-anchor="middle" font-size="17" fill="#c1bac7"><text x="250" y="214">Recent first · load older pages</text><text x="750" y="214">Available local history · dated snapshot</text><text x="500" y="377">A candidate for attention is not proof you owe a reply</text><text x="500" y="532">Open the source · change any label later</text></g>
<g stroke="#e4cc93" fill="none" stroke-width="2" marker-end="url(#arrow)"><path d="M250 240V270H400V301"/><path d="M750 240V270H600V301"/><path d="M500 405V461"/><path d="M500 555V582H180V611"/><path d="M500 555V611"/><path d="M500 582H820V611"/></g>
<text x="50" y="710" font-size="16" fill="#c1bac7">New message → review again. No automatic replies, inbox edits, or paid AI calls in this version.</text></g></svg>
